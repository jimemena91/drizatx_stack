# Plantilla para incorporar un cliente nuevo.
# Copiar este archivo con el identificador del cliente:
#
#   cp template.conf nuevo-cliente.conf
#
# No incluir secretos, tokens ni contraseñas.

CLIENT_NAME="Nombre comercial"

EXPECTED_HOST="ubuntu-8gb-hel1-1"
WORKTREE="/opt/drizatx_worktrees/cliente-prod"
BRANCH="cliente/prod"

COMPOSE_PROJECT="cliente-prod"
COMPOSE_FILE="/opt/drizatx_worktrees/cliente-prod/docker-compose.cliente.yml"
FRONTEND_SERVICE="frontend"

FRONTEND_CONTAINER="drizatx-cliente-frontend"
BACKEND_CONTAINER="drizatx-cliente-backend"
DB_CONTAINER="drizatx-cliente-mysql"

FRONTEND_IMAGE="cliente-prod-frontend:latest"
NETWORK="drizatx-cliente-network"

FRONTEND_PORT="0000"
BACKEND_PORT="0000"
TEST_PORT="0000"

PUBLIC_BASE_URL="https://cliente.app.drizatx.com"
PUBLIC_API_URL="https://cliente.api.drizatx.com"
